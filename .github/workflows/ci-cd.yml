name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          
